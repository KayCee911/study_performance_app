<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — EduPortal</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #080c14; --surface: #0e1420; --card: #121929;
  --border: rgba(255,255,255,0.07);
  --accent: #00d2aa; --accent-dim: rgba(0,210,170,0.12);
  --text: #e8eaf2; --muted: #6b7494; --subtle: #3a4060;
  --danger: #ff5c6a; --radius: 14px;
}
body { font-family: 'Sora', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; animation: drift 20s ease-in-out infinite; }
.orb-1 { width: 340px; height: 340px; background: rgba(0,210,170,0.06); top: -80px; left: -50px; }
.orb-2 { width: 300px; height: 300px; background: rgba(100,90,220,0.05); bottom: -60px; right: -40px; animation-delay: -8s; }
@keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(18px,22px); } }
.grid-bg { position: fixed; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 40px 40px; }
.page { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 24px; animation: slideUp 0.5s cubic-bezier(0.22,1,0.36,1) both; }
@keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 36px; }
.brand-mark { width: 36px; height: 36px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; color: #080c14; }
.brand-name { font-size: 15px; font-weight: 500; }
.brand-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px; position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.4; }
.card-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
.card-sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; line-height: 1.6; }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.input-wrap { position: relative; }
.field input { width: 100%; padding: 13px 44px 13px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: 'DM Mono', monospace; font-size: 14px; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; outline: none; }
.field input:hover { border-color: var(--subtle); }
.field input:focus { border-color: var(--accent); background: rgba(0,210,170,0.04); box-shadow: 0 0 0 3px rgba(0,210,170,0.1); }
.field input::placeholder { color: var(--subtle); }
.toggle-vis { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--muted); font-size: 12px; user-select: none; font-family: 'DM Mono', monospace; transition: color 0.2s; }
.toggle-vis:hover { color: var(--text); }

/* Strength */
.strength-bar { display: flex; gap: 4px; margin-top: 8px; }
.strength-seg { flex: 1; height: 3px; border-radius: 3px; background: var(--subtle); transition: background 0.3s; }
.strength-label { font-size: 11px; color: var(--muted); margin-top: 5px; }
.s1 .strength-seg:nth-child(1) { background: #ff5c6a; }
.s2 .strength-seg:nth-child(1), .s2 .strength-seg:nth-child(2) { background: #f4a62a; }
.s3 .strength-seg:nth-child(1), .s3 .strength-seg:nth-child(2), .s3 .strength-seg:nth-child(3) { background: var(--accent); }
.s4 .strength-seg { background: var(--accent); }

/* Requirements list */
.reqs { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.req { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); transition: color 0.2s; }
.req.met { color: var(--accent); }
.req-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--subtle); flex-shrink: 0; transition: background 0.2s; }
.req.met .req-dot { background: var(--accent); }

.btn { width: 100%; padding: 14px; background: var(--accent); color: #080c14; border: none; border-radius: var(--radius); font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s; letter-spacing: 0.02em; position: relative; }
.btn:hover { opacity: 0.92; box-shadow: 0 6px 24px rgba(0,210,170,0.25); }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn.loading { color: transparent; }
.btn.loading::after { content: ''; position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border: 2px solid rgba(8,12,20,0.3); border-top-color: #080c14; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.msg { margin-top: 16px; padding: 11px 14px; border-radius: 10px; font-size: 13px; line-height: 1.4; display: none; }
.msg.error { background: rgba(255,92,106,0.1); color: var(--danger); border: 1px solid rgba(255,92,106,0.2); display: block; }
.msg.success { background: rgba(0,210,170,0.1); color: var(--accent); border: 1px solid rgba(0,210,170,0.2); display: block; }
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="grid-bg"></div>
<div class="page">
  <div class="brand">
    <div class="brand-mark">E</div>
    <div>
      <div class="brand-name">EduPortal</div>
      <div class="brand-sub">Learning Management System</div>
    </div>
  </div>
  <div class="card">
    <h1 class="card-title">New password</h1>
    <p class="card-sub">Choose a strong password to keep your account secure.</p>

    <div class="field">
      <label>New password</label>
      <div class="input-wrap">
        <input id="password" type="password" placeholder="Enter new password" autocomplete="new-password" oninput="checkStrength(this.value)">
        <span class="toggle-vis" onclick="toggleVis()">show</span>
      </div>
      <div class="strength-bar" id="strengthBar">
        <div class="strength-seg"></div>
        <div class="strength-seg"></div>
        <div class="strength-seg"></div>
        <div class="strength-seg"></div>
      </div>
      <div class="strength-label" id="strengthLabel">Enter a password</div>
      <div class="reqs">
        <div class="req" id="r-len"><div class="req-dot"></div>At least 8 characters</div>
        <div class="req" id="r-case"><div class="req-dot"></div>Upper and lowercase letters</div>
        <div class="req" id="r-num"><div class="req-dot"></div>At least one number</div>
      </div>
    </div>

    <button class="btn" id="resetBtn" onclick="reset()">Set new password</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
const levels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
function checkStrength(val) {
  let score = 0;
  const len = val.length >= 8;
  const cas = /[A-Z]/.test(val) && /[a-z]/.test(val);
  const num = /\d/.test(val);
  if (len) score++;
  if (cas) score++;
  if (num) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const bar = document.getElementById('strengthBar');
  bar.className = 'strength-bar' + (val.length ? ' s' + Math.max(1, score) : '');
  document.getElementById('strengthLabel').textContent = val.length ? levels[Math.max(1, score)] : 'Enter a password';
  document.getElementById('r-len').className = 'req' + (len ? ' met' : '');
  document.getElementById('r-case').className = 'req' + (cas ? ' met' : '');
  document.getElementById('r-num').className = 'req' + (num ? ' met' : '');
}
let visible = false;
function toggleVis() {
  visible = !visible;
  document.getElementById('password').type = visible ? 'text' : 'password';
  document.querySelector('.toggle-vis').textContent = visible ? 'hide' : 'show';
}
async function reset() {
  const btn = document.getElementById('resetBtn');
  const msg = document.getElementById('msg');
  msg.className = 'msg'; msg.textContent = '';
  btn.classList.add('loading'); btn.disabled = true;
  const token = window.location.pathname.split('/').pop();
  try {
    const res = await fetch(`/reset-password/${token}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value })
    });
    const data = await res.json();
    if (res.ok) {
      msg.textContent = data.message || 'Password updated! Redirecting to login…';
      msg.classList.add('success');
      setTimeout(() => window.location.href = '/login', 1500);
    } else {
      msg.textContent = data.error || 'Reset failed. Your link may have expired.';
      msg.classList.add('error');
      btn.classList.remove('loading'); btn.disabled = false;
    }
  } catch {
    msg.textContent = 'Network error. Please check your connection.';
    msg.classList.add('error');
    btn.classList.remove('loading'); btn.disabled = false;
  }
}
</script>
</body>
</html>
