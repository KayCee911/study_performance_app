<!DOCTYPE html>
<html>
<head>
    <title>AI Study Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">📊 AI Study Dashboard</h2>

    <!-- Email Input -->
    <div class="mb-4">
        <input type="text" id="email" class="form-control" placeholder="Enter your email">
        <button onclick="loadDashboard()" class="btn btn-primary mt-2">Load Dashboard</button>
    </div>

    <!-- Summary Cards -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card text-center p-3 shadow">
                <h5>GPA</h5>
                <h3 id="gpa">--</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center p-3 shadow">
                <h5>Study Hours</h5>
                <h3 id="hours">--</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center p-3 shadow">
                <h5>Difficulty</h5>
                <h3 id="difficulty">--</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center p-3 shadow">
                <h5>Courses</h5>
                <h3 id="courses">--</h3>
            </div>
        </div>
    </div>

    <div class="card p-3 mb-4 shadow">
    <h5>🤖 AI Summary</h5>
    <p id="aiSummary">--</p>
    </div>

    <!-- Chart -->
    <div class="card p-4 shadow mb-4">
        <h5>📈 GPA Improvement</h5>
        <canvas id="gpaChart"></canvas>
    </div>

    <!-- Recommendations -->
    <div id="recommendations"></div>

</div>

<script>

let chartInstance = null;

async function loadDashboard() {

    const email = document.getElementById("email").value;

    // =====================
    // LOAD INSIGHTS
    // =====================
    const res1 = await fetch(`/user/${email}/insights`);
    const insights = await res1.json();

    document.getElementById("gpa").innerText = insights.avg_gpa;
    document.getElementById("hours").innerText = insights.avg_study_hours;
    document.getElementById("difficulty").innerText = insights.avg_difficulty;
    document.getElementById("courses").innerText = insights.total_courses;

    // =====================
    // LOAD ML DATA
    // =====================
    const res2 = await fetch(`/ml-recommend/${email}`);
    const response = await res2.json();

    const data = response.results || [];
    const summary = response.summary || "No insights available.";

    // ✅ FIX: set summary AFTER fetch
    document.getElementById("aiSummary").innerText = summary;

    const container = document.getElementById("recommendations");
    container.innerHTML = "";

    let labels = [];
    let currentData = [];
    let improvedData = [];

    if (data.length === 0) {
        container.innerHTML = `<div class="alert alert-warning">No recommendations found</div>`;
        return;
    }

    data.forEach(item => {

        labels.push(item.course);
        currentData.push(item.current_gpa);
        improvedData.push(item.improved_gpa);

        const confidencePercent = Math.round((item.confidence || 0) * 100);

        const explanations = (item.why || []).map(e => `<li>${e}</li>`).join("");

        const card = `
        <div class="card p-3 mb-3 shadow">
            <h5>${item.course}</h5>

            <p><b>Current GPA:</b> ${item.current_gpa}</p>
            <p><b>Improved GPA:</b> ${item.improved_gpa}</p>

            <p><b>Suggestion:</b> ${item.suggestion}</p>

            <label><b>Confidence:</b> ${confidencePercent}%</label>
            <div class="progress mb-2">
                <div class="progress-bar bg-success" 
                     style="width: ${confidencePercent}%">
                </div>
            </div>

            <ul>${explanations}</ul>

            ${item.peer_insight ? `<p><i>${item.peer_insight}</i></p>` : ""}
        </div>
        `;

        container.innerHTML += card;
    });

    // =====================
    // DRAW CHART
    // =====================
    const ctx = document.getElementById('gpaChart');

    if (chartInstance) {
        chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Current GPA',
                    data: currentData
                },
                {
                    label: 'Improved GPA',
                    data: improvedData
                }
            ]
        },
        options: {
            responsive: true
        }
    });
}
</script>

</body>
</html>
