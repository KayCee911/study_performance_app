<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — EduPortal</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #080c14; --surface: #0e1420; --card: #121929;
  --border: rgba(255,255,255,0.07);
  --accent: #00d2aa; --accent-dim: rgba(0,210,170,0.12);
  --amber: #f4a62a;
  --text: #e8eaf2; --muted: #6b7494; --subtle: #3a4060;
  --danger: #ff5c6a; --radius: 14px;
}
body { font-family: 'Sora', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.orb { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; animation: drift 20s ease-in-out infinite; }
.orb-1 { width: 320px; height: 320px; background: rgba(0,210,170,0.06); top: -60px; right: -40px; }
.orb-2 { width: 280px; height: 280px; background: rgba(244,166,42,0.05); bottom: -50px; left: -30px; animation-delay: -10s; }
@keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(15px,20px); } }
.grid-bg { position: fixed; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 40px 40px; }
.page { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 24px; animation: slideUp 0.5s cubic-bezier(0.22,1,0.36,1) both; }
@keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 36px; }
.brand-mark { width: 36px; height: 36px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; color: #080c14; }
.brand-name { font-size: 15px; font-weight: 500; }
.brand-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px; position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--amber), transparent); opacity: 0.4; }
.icon-wrap { width: 52px; height: 52px; border-radius: 16px; background: var(--amber); opacity: 0.15; position: absolute; top: 28px; right: 28px; }
.icon-wrap-inner { position: absolute; top: 28px; right: 28px; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; }
.card-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
.card-sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; line-height: 1.6; }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.field input { width: 100%; padding: 13px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: 'DM Mono', monospace; font-size: 14px; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; outline: none; }
.field input:hover { border-color: var(--subtle); }
.field input:focus { border-color: var(--accent); background: rgba(0,210,170,0.04); box-shadow: 0 0 0 3px rgba(0,210,170,0.1); }
.field input::placeholder { color: var(--subtle); }
.btn { width: 100%; padding: 14px; background: var(--accent); color: #080c14; border: none; border-radius: var(--radius); font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s; letter-spacing: 0.02em; position: relative; }
.btn:hover { opacity: 0.92; box-shadow: 0 6px 24px rgba(0,210,170,0.25); }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn.loading { color: transparent; }
.btn.loading::after { content: ''; position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border: 2px solid rgba(8,12,20,0.3); border-top-color: #080c14; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.msg { margin-top: 16px; padding: 11px 14px; border-radius: 10px; font-size: 13px; line-height: 1.4; display: none; }
.msg.error { background: rgba(255,92,106,0.1); color: var(--danger); border: 1px solid rgba(255,92,106,0.2); display: block; }
.msg.success { background: rgba(0,210,170,0.1); color: var(--accent); border: 1px solid rgba(0,210,170,0.2); display: block; }

/* Sent state */
.sent-state { display: none; text-align: center; padding: 12px 0; }
.sent-state.active { display: block; }
.sent-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-dim); border: 1px solid rgba(0,210,170,0.25); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
.sent-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.sent-sub { font-size: 13px; color: var(--muted); line-height: 1.6; }
.sent-email { color: var(--accent); font-weight: 500; }

.footer-link { text-align: center; margin-top: 24px; font-size: 13px; color: var(--muted); }
.footer-link a { color: var(--accent); text-decoration: none; font-weight: 500; }
.footer-link a:hover { text-decoration: underline; }
.back-link { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); text-decoration: none; margin-bottom: 32px; transition: color 0.2s; width: fit-content; }
.back-link:hover { color: var(--text); }
.back-arrow { font-size: 16px; }
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="grid-bg"></div>
<div class="page">
  <div class="brand">
    <div class="brand-mark">E</div>
    <div>
      <div class="brand-name">EduPortal</div>
      <div class="brand-sub">Learning Management System</div>
    </div>
  </div>
  <a href="/login" class="back-link"><span class="back-arrow">←</span> Back to login</a>
  <div class="card">
    <div id="formState">
      <h1 class="card-title">Reset password</h1>
      <p class="card-sub">Enter your account email and we'll send you a secure link to reset your password.</p>
      <div class="field">
        <label>Email address</label>
        <input id="email" type="email" placeholder="you@university.edu" autocomplete="email">
      </div>
      <button class="btn" id="sendBtn" onclick="send()">Send reset link</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="sent-state" id="sentState">
      <div class="sent-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00d2aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <div class="sent-title">Check your inbox</div>
      <div class="sent-sub">We sent a reset link to<br><span class="sent-email" id="sentEmail"></span></div>
    </div>
  </div>
</div>
<script>
async function send() {
  const btn = document.getElementById('sendBtn');
  const msg = document.getElementById('msg');
  const emailVal = document.getElementById('email').value;
  msg.className = 'msg'; msg.textContent = '';
  btn.classList.add('loading'); btn.disabled = true;
  try {
    const res = await fetch('/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: emailVal })
    });
    const data = await res.json();
    if (res.ok) {
      document.getElementById('sentEmail').textContent = emailVal;
      document.getElementById('formState').style.display = 'none';
      document.getElementById('sentState').classList.add('active');
    } else {
      msg.textContent = data.error || 'Could not send reset link. Try again.';
      msg.classList.add('error');
      btn.classList.remove('loading'); btn.disabled = false;
    }
  } catch {
    msg.textContent = 'Network error. Please check your connection.';
    msg.classList.add('error');
    btn.classList.remove('loading'); btn.disabled = false;
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
